[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceshift-documents"
version = "0.3.0"
description = "Local document ingestion and evidence-perturbation API for EvidenceShift"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2,<3", "pypdf>=6,<7", "python-docx>=1.2,<2", "langchain-text-splitters>=0.3,<2",
  "chromadb>=1,<2", "sentence-transformers>=3,<7", "ollama>=0.6,<1",
  "httpx>=0.27,<1", "pandas>=2,<4", "ipykernel>=6,<8"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
local = ["streamlit>=1.42,<2"]
[tool.setuptools.packages.find]
where = ["src"]
