name: Software contracts and frozen result integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test,local]'
      - run: python scripts/check_repository.py
      - run: python -m pytest -q tests
      - run: python compare_evidence_models.py --self-test
      - run: python run_direct_answer_baseline.py --self-test
      - run: python run_direct_confirmation.py --self-test
